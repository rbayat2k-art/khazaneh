<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#bgLight)" />

  <!-- Decorative Subtle Grid -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Document / Ledger Sheet 1 -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="680" height="220" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <rect x="24" y="24" width="150" height="32" rx="8" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="99" y="45" fill="#38BDF8" font-family="Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">تایید نهایی حسابداری</text>
    <text x="650" y="45" fill="#F8FAFC" font-family="Tahoma, sans-serif" font-size="16" font-weight="bold" text-anchor="end">سند دستور پرداخت و کنترل بودجه مرکز هزینه</text>

    <line x1="24" y1="74" x2="656" y2="74" stroke="#334155" stroke-width="1" />

    <text x="650" y="108" fill="#94A3B8" font-family="Tahoma, sans-serif" font-size="13" text-anchor="end">شماره شبا مقصد (IBAN): IR520120000000109482711004</text>
    <text x="650" y="140" fill="#94A3B8" font-family="Tahoma, sans-serif" font-size="13" text-anchor="end">مرکز هزینه: توسعه زیرساخت ابری و دیتاسنتر (CC-0104)</text>
    <text x="650" y="176" fill="#34D399" font-family="Tahoma, sans-serif" font-size="15" font-weight="bold" text-anchor="end">مبلغ مصوب قابل پرداخت: ۶۴۰,۰۰۰,۰۰۰ ریال</text>

    <rect x="24" y="142" width="190" height="48" rx="10" fill="#065F46" stroke="#10B981" stroke-width="1.2" />
    <text x="119" y="171" fill="#ECFDF5" font-family="Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">آماده واریز در صف خزانه</text>
  </g>

  <!-- Bank Settlement & RBAC Security Card -->
  <g transform="translate(60, 305)">
    <rect x="0" y="0" width="325" height="240" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="300" y="42" fill="#FBBF24" font-family="Tahoma, sans-serif" font-size="15" font-weight="bold" text-anchor="end">کنترل دسترسی مبتنی بر نقش (RBAC)</text>
    <text x="300" y="76" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· تعریف سقف تایید سرپرست و حسابداری</text>
    <text x="300" y="106" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· تفکیک دسترسی شرکت‌ها و واحدهای سازمانی</text>
    <text x="300" y="136" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· ثبت تاریخچه تغییرناپذیر (Audit Trail)</text>
    <text x="300" y="166" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· احراز هویت دومرحله‌ای (2FA) و پیامک</text>
    <rect x="24" y="186" width="277" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="162" y="207" fill="#38BDF8" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">امنیت سازمانی چندلایه فعال</text>

    <rect x="355" y="0" width="325" height="240" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="655" y="42" fill="#34D399" font-family="Tahoma, sans-serif" font-size="15" font-weight="bold" text-anchor="end">خزانه‌داری و بایگانی فیش‌های بانکی</text>
    <text x="655" y="76" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· ثبت تصویر ثابت حساب مبدأ در لحظه پرداخت</text>
    <text x="655" y="106" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· خروجی استاندارد اکسل پایا و ساتنا</text>
    <text x="655" y="136" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· پرداخت مرحله‌ای (جزئی یا کامل)</text>
    <text x="655" y="166" fill="#CBD5E1" font-family="Tahoma, sans-serif" font-size="12" text-anchor="end">· بستن روکش روزانه و آرشیو پوشه‌های روز</text>
    <rect x="379" y="186" width="277" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="517" y="207" fill="#6EE7B7" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">تسویه و بایگانی خودکار اسناد</text>
  </g>
</svg>
